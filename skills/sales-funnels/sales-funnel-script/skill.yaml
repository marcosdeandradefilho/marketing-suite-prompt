## B. Estrutura 3-Ato de Lançamento (mais ágil)

Para lives mais curtas (20-30 min).

### ATO 1: Problema (5 min)
- Qual é o problema que 90% tem?
- Por que ninguém resolve isso?
- O custo de NÃO resolver

Exemplo:
"90% dos criadores faz conteúdo e NINGUÉM vê.
Por quê?
Porque estão postando errado.
E isso custa: perda de oportunidade, desânimo, desistência."

### ATO 2: Solução (10 min)
- A fórmula/framework de 3-5 passos
- Caso de um cliente real
- Prove que funciona (número, tempo, resultado)

Exemplo:
"Existem 3 pilares do conteúdo viral:
1. HOOK nos 1.5s primeiros (aqui roubamos atenção)
2. RETENÇÃO até o final (aqui mantemos engajado)
3. CTA que converte (aqui pedimos ação)

Exemplo: [Video de 30s mostrando]"

### ATO 3: Oferta (5-10 min)
- O que você vende
- Quanto custa + valor percebido
- Por que agora (urgência)
- CTA (link)

Exemplo:
"Criei um programa de 8 semanas que ensina TUDO.
Normalmente custa R$897.
Mas hoje, lançamento, R$197.
Apenas 100 pessoas entram.
Já são 87 inscritas.
Clique aqui 👇"

