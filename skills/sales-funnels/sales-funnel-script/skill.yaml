## C. Checklist de Webinar/Live

Antes de ir ao ar:

### Técnico
- [ ] Câmera testada (qual ângulo?)
- [ ] Áudio limpo (microfone? fundo barulhento?)
- [ ] Internet estável (qual velocidade? backup?)
- [ ] Slides prontas (qual software? navegação smooth?)
- [ ] Chat/live monitorado (quem responde?)

### Conteúdo
- [ ] Hook memorável (primeiros 30s robustos)?
- [ ] Autoridade estabelecida (por que ouvir você)?
- [ ] Story completa (antes → gatilho → ação → depois)?
- [ ] Value real (ensinando algo útil)?
- [ ] Oferta clara (qual é a venda? Quanto custa?)?
- [ ] CTA inequívoco (qual é o link/ação?)?

### Psicologia
- [ ] Abertura forte (captura de atenção)?
- [ ] Social proof mencionado (depoimentos/números)?
- [ ] Urgência real (prazo/limite/preço)?
- [ ] Encerramento memorável (não fade out)?

