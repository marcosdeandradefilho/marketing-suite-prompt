## D. Exemplo Pronto: Live de Lançamento (30 min)

**[HOOK - 0-1 min]**
"Oi galera! Tô lançando hoje um programa que vai triplicar
sua renda com conteúdo. Em 30 minutos vou mostrar
como 3 pessoas ganham R$15k/mês com isso."

**[GRATIDÃO - 1-2 min]**
"Agradeço vocês. Eu gastei 2 anos descobrindo isso.
Agora vou dar pra vocês em 30 min."

**[PROBLEMA - 2-7 min]**
"90% dos criadores vira funcionário de rede social.
Por quê? Porque não entendem a psicologia de viralização."

**[STORY - 7-17 min]**
"Há 1 ano eu era exatamente assim. Postava, ninguém via.
Um dia conversei com um especialista em algoritmo.
Descobri 3 coisas que ninguém comenta:
1. [Detalhe técnico]
2. [Detalhe psicológico]
3. [Detalhe de distribuição]

Em 3 meses, virou R$15k. Hoje ajudo 200 criadores."

**[VALUE - 17-25 min]**
"Vou te ensinar as 3 coisas:
[Demonstração com exemplos reais, vídeos, prints]"

**[STACK - 25-27 min]**
"O programa custa R$297 + 5 bônus.
Valor total: R$1,200.
Hoje: R$97.
Apenas 50 vagas."

**[URGENCY - 27-28 min]**
"Preço sobe amanhã.
Clica no link agora."

**[CTA - 28-30 min]**
"Clique aqui → [link]
Vejo você lá do outro lado!"
