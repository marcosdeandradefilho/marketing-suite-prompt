# Sales Funnel Script — Estrutura de Webinar + Live de Lançamento

## A. Perfect Webinar Script (Russell Brunson)

A estrutura mais pronta de webinar que converte 15-30%.

### 1. **HOOK (0-2 min)** — Capte atenção
"Oi, meu nome é [Nome]. Em 30 minutos vou te mostrar [PROMESSA ESPECÍFICA]."

Formato:
- Agradecimento (obrigado por estar aqui)
- Nome + o que você faz em 1 frase
- Promessa clara (não vague)
- Timeline (quanto tempo vai tomar)

Exemplo:
"Oi, sou Marcos. Professor de criação de conteúdo há 20 anos. Hoje vou te mostrar como
criar um post viral em 15 minutos (mesmo que você tenha zero seguidores). Isso vai tomar 30 minutos."

### 2. **GRATIDÃO (1 min)** — Contexto
Por que eles deveriam te ouvir?

"Agradeço vocês terem vindo. Antes de começar, queria contar:
- Em 2023, tinha 0 seguidores
- Apliquei 3 frameworks simples
- Hoje tenho 50k seguidores
- Ajudei 2.000 criadores com esse sistema"

Meta: Estabelecer autoridade + relatabilidade.

### 3. **THE BIG PROMISE (2-3 min)** — Problema + Solução teaser
"Qual é o problema que as pessoas têm?
- Pensam que precisam de equipamento caro
- Acham que precisam aparecer no rosto
- Acreditam que leva meses de consistência

A verdade é outra. Vou mostrar os 3 passos que mudam tudo."

### 4. **STORY (10-15 min)** — Narrativa de transformação

**A. Antes**
Descreva o cliente ideal ANTES (não você):
- "Aquela pessoa que trabalha 8h, ganha R$3k, está morto de cansaço"
- "Quer mais renda mas não tem tempo"
- "Tentou: TikTok, Instagram, YouTube — fracassou"

**B. O gatilho/descoberta**
"Um dia, conversando com [pessoa X], descobri uma coisa:
- Que todos estavam fazendo errado
- Um padrão que ninguém comentava
- Uma regra invertida"

**C. A ação (o passo a passo)**
"Aí apliquei 3 passos simples:
1. [Passo 1 - descrição]
2. [Passo 2 - descrição]
3. [Passo 3 - descrição]"

**D. Depois (resultado)**
"Em 30 dias:
- R$15k em renda extra
- 50k seguidores
- Virou meu produto estrela"

**E. Transição para a oferta**
"E agora vou te ensinar exatamente como fazer isso."

### 5. **VALUE CONTENT (15-20 min)** — Dê conteúdo real
Aqui você realmente ENSINA (não vende).

Formato:
- Apresente 3 frameworks/passos
- Explique cada um com exemplos concretos
- Mostre print/vídeo/case real
- Use slides que clarificam

Dica: Quanto melhor o conteúdo grátis, maior a confiança → maior a venda.

### 6. **STACK (5-8 min)** — Oferta de valor

"Agora vou mostrar exatamente o que vou te dar.

**Módulo 1:** [O que inclui] (Valor: R$500)
**Módulo 2:** [O que inclui] (Valor: R$300)
**Módulo 3:** [O que inclui] (Valor: R$200)
**Bônus 1:** [O que inclui] (Valor: R$500)
**Bônus 2:** [O que inclui] (Valor: R$300)

Valor total: R$1.800
Hoje você vai pagar apenas: R$197"

Dica: Sempre soma os valores individuais. Cria percepção de desconto.

### 7. **URGENCY + SCARCITY (2 min)** — Por que agora?

"Essa oferta só vale HOJE:
- [ ] Preço sobe para R$297 amanhã
- [ ] Bônus [X] desaparece em 24h
- [ ] Apenas 50 vagas para turma ao vivo
- [ ] Você entra agora ou espera próximo mês"

Escolha 1-2 gatilhos reais (não minta).

### 8. **CALL TO ACTION (1 min)** — Close

"Clique no link abaixo. Você vai para uma página com:
- Resumo tudo que mostrei
- Depoimentos de clientes
- Perguntas frequentes
- Botão para garantir seu lugar

Vejo você do outro lado!"

