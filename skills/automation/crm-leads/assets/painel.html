<!doctype html>
<html lang="pt-BR" data-tema="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de leads</title>
<style>
/* ---------- tokens ---------- */
:root{
  --bg:#f6f7f9; --bg-2:#eef0f4; --surface:#ffffff; --surface-2:#f9fafb;
  --linha:#e2e5ea; --linha-forte:#cdd2da;
  --txt:#15181d; --txt-2:#5b6270; --txt-3:#868d9b;
  --acento:#2f5fe0; --acento-txt:#ffffff; --acento-fraco:#e8eeff;
  --quente:#d4342c; --quente-bg:#fdeceb;
  --morno:#b4740a; --morno-bg:#fdf3e2;
  --frio:#5b6470; --frio-bg:#eef0f3;
  --ok:#1f7a45; --ok-bg:#e8f5ee;
  --sombra:0 1px 2px rgba(15,20,30,.06), 0 4px 12px rgba(15,20,30,.05);
  --sombra-alta:0 8px 30px rgba(15,20,30,.14);
  --r:10px;
}
:root[data-tema="escuro"]{
  --bg:#11141a; --bg-2:#0d1015; --surface:#181c24; --surface-2:#1e232c;
  --linha:#2a303b; --linha-forte:#3a4250;
  --txt:#e7eaf0; --txt-2:#a2abba; --txt-3:#727c8c;
  --acento:#6d97ff; --acento-txt:#0d1015; --acento-fraco:#1c2740;
  --quente:#ff7b70; --quente-bg:#3a1f1d;
  --morno:#e6b256; --morno-bg:#332714;
  --frio:#95a0b0; --frio-bg:#232932;
  --ok:#5fd196; --ok-bg:#122c20;
  --sombra:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  --sombra-alta:0 10px 34px rgba(0,0,0,.5);
}
@media (prefers-color-scheme:dark){
  :root[data-tema="auto"]{
    --bg:#11141a; --bg-2:#0d1015; --surface:#181c24; --surface-2:#1e232c;
    --linha:#2a303b; --linha-forte:#3a4250;
    --txt:#e7eaf0; --txt-2:#a2abba; --txt-3:#727c8c;
    --acento:#6d97ff; --acento-txt:#0d1015; --acento-fraco:#1c2740;
    --quente:#ff7b70; --quente-bg:#3a1f1d;
    --morno:#e6b256; --morno-bg:#332714;
    --frio:#95a0b0; --frio-bg:#232932;
    --ok:#5fd196; --ok-bg:#122c20;
    --sombra:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    --sombra-alta:0 10px 34px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--txt);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; overflow:hidden;
}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--linha-forte); border-radius:6px; border:3px solid transparent; background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ---------- topo ---------- */
header{
  flex:0 0 auto; background:var(--surface); border-bottom:1px solid var(--linha);
  padding:12px 18px; display:flex; flex-wrap:wrap; gap:12px; align-items:center;
}
.marca{display:flex; flex-direction:column; gap:1px; margin-right:6px}
.marca b{font-size:15px; font-weight:650; letter-spacing:-.01em}
.marca span{font-size:12px; color:var(--txt-3)}
.busca{position:relative; flex:1 1 220px; max-width:340px}
.busca input{
  width:100%; padding:8px 12px 8px 32px; border:1px solid var(--linha);
  border-radius:8px; background:var(--surface-2); outline:none;
}
.busca input:focus{border-color:var(--acento); box-shadow:0 0 0 3px var(--acento-fraco)}
.busca svg{position:absolute; left:10px; top:9px; opacity:.45}
.filtros{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
select.f{
  padding:8px 10px; border:1px solid var(--linha); border-radius:8px;
  background:var(--surface-2); outline:none; max-width:190px;
}
.acoes{margin-left:auto; display:flex; gap:8px; align-items:center}
.btn{
  padding:8px 12px; border:1px solid var(--linha); border-radius:8px;
  background:var(--surface-2); font-size:13px; font-weight:550; white-space:nowrap;
}
.btn:hover{border-color:var(--linha-forte); background:var(--surface)}
.btn.principal{background:var(--acento); color:var(--acento-txt); border-color:transparent}
.btn.principal:hover{filter:brightness(1.06)}
.btn.icone{padding:8px 9px; line-height:0}
.salvo{font-size:12px; color:var(--txt-3); min-width:74px; text-align:right}
.salvo.on{color:var(--ok)}
.aviso{
  flex:1 0 100%; font-size:12.5px; padding:8px 11px; border-radius:8px;
  background:var(--morno-bg); color:var(--morno); border:1px solid transparent;
}
.aviso.off{display:none}

/* ---------- resumo ---------- */
.resumo{
  flex:0 0 auto; display:flex; gap:8px; padding:10px 18px 0; flex-wrap:wrap;
}
.chip{
  display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border-radius:99px;
  background:var(--surface); border:1px solid var(--linha); font-size:12.5px; color:var(--txt-2);
}
.chip b{color:var(--txt); font-weight:650}
.ponto{width:7px;height:7px;border-radius:99px;background:var(--frio)}
.ponto.q{background:var(--quente)} .ponto.m{background:var(--morno)}

/* ---------- board ---------- */
main{flex:1 1 auto; overflow-x:auto; overflow-y:hidden; padding:14px 18px 18px}
.board{display:flex; gap:12px; height:100%; align-items:stretch; min-height:0}
.coluna{
  flex:1 1 224px; min-width:216px; display:flex; flex-direction:column; height:100%;
  background:var(--bg-2); border:1px solid var(--linha); border-radius:12px;
}
.coluna.alvo{border-color:var(--acento); background:var(--acento-fraco)}
.col-topo{
  display:flex; align-items:center; gap:8px; padding:11px 12px 9px;
  border-bottom:1px solid var(--linha); position:sticky; top:0;
}
.col-topo .barra{width:3px; height:14px; border-radius:2px; background:var(--linha-forte)}
.col-topo h2{margin:0; font-size:13px; font-weight:650; letter-spacing:.01em}
.col-topo .n{
  margin-left:auto; font-size:11.5px; color:var(--txt-3); background:var(--surface);
  border:1px solid var(--linha); border-radius:99px; padding:1px 7px; font-variant-numeric:tabular-nums;
}
.lista{overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:9px; min-height:60px}
.vazio-col{
  font-size:12.5px; color:var(--txt-3); text-align:center; padding:16px 8px;
  border:1px dashed var(--linha-forte); border-radius:9px;
}

/* ---------- card ---------- */
.card{
  background:var(--surface); border:1px solid var(--linha); border-radius:var(--r);
  padding:11px 12px; box-shadow:var(--sombra); cursor:grab; position:relative;
  transition:transform .08s ease, box-shadow .12s ease, border-color .12s ease;
}
.card:hover{border-color:var(--linha-forte); box-shadow:var(--sombra-alta); transform:translateY(-1px)}
.card.arrastando{opacity:.4}
.card .l1{display:flex; align-items:flex-start; gap:8px}
.card h3{margin:0; font-size:14px; font-weight:640; line-height:1.3; letter-spacing:-.01em; flex:1}
.nota{
  flex:0 0 auto; font-size:11.5px; font-weight:700; padding:2px 7px; border-radius:99px;
  font-variant-numeric:tabular-nums; background:var(--frio-bg); color:var(--frio);
}
.nota.q{background:var(--quente-bg); color:var(--quente)}
.nota.m{background:var(--morno-bg); color:var(--morno)}
.card .l2{margin-top:3px; font-size:12px; color:var(--txt-3)}
.card .sinal{
  margin-top:7px; font-size:12.5px; color:var(--txt-2); line-height:1.4;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.card .l3{margin-top:9px; display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.tag{
  font-size:11px; padding:2px 7px; border-radius:6px; background:var(--surface-2);
  border:1px solid var(--linha); color:var(--txt-2); white-space:nowrap;
}
.tag.t-quente{background:var(--quente-bg); color:var(--quente); border-color:transparent}
.tag.t-morno{background:var(--morno-bg); color:var(--morno); border-color:transparent}
.tag.t-frio{background:var(--frio-bg); color:var(--frio); border-color:transparent}
.tag.t-ok{background:var(--ok-bg); color:var(--ok); border-color:transparent}
.selo-novo{
  font-size:10px; font-weight:700; letter-spacing:.06em; padding:2px 6px; border-radius:5px;
  background:var(--acento); color:var(--acento-txt);
}
.mini{margin-left:auto; display:flex; gap:5px; opacity:.55}
.mini svg{display:block}
.card.mudo{opacity:.5}

/* ---------- gaveta ---------- */
.fundo{
  position:fixed; inset:0; background:rgba(10,13,18,.42); backdrop-filter:blur(2px);
  opacity:0; pointer-events:none; transition:opacity .16s ease; z-index:40;
}
.fundo.on{opacity:1; pointer-events:auto}
.gaveta{
  position:fixed; top:0; right:0; height:100%; width:min(470px,100%);
  background:var(--surface); border-left:1px solid var(--linha); box-shadow:var(--sombra-alta);
  transform:translateX(102%); transition:transform .2s cubic-bezier(.3,.8,.4,1); z-index:41;
  display:flex; flex-direction:column;
}
.gaveta.on{transform:none}
.g-topo{padding:16px 18px 12px; border-bottom:1px solid var(--linha)}
.g-topo .linha1{display:flex; align-items:flex-start; gap:10px}
.g-topo h2{margin:0; font-size:19px; font-weight:660; letter-spacing:-.02em; line-height:1.25; flex:1}
.fechar{background:none; border:none; color:var(--txt-3); font-size:22px; line-height:1; padding:2px 4px}
.fechar:hover{color:var(--txt)}
.g-sub{margin-top:4px; font-size:12.5px; color:var(--txt-3)}
.g-corpo{flex:1; overflow-y:auto; padding:16px 18px 28px}
.bloco{margin-bottom:18px}
.bloco > .rot{
  font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
  color:var(--txt-3); margin-bottom:6px;
}
.bloco p{margin:0; font-size:14px; line-height:1.55}
.bloco p + p{margin-top:8px}
.caixa{
  background:var(--surface-2); border:1px solid var(--linha); border-radius:var(--r);
  padding:11px 12px; font-size:13.5px; line-height:1.5;
}
.caixa.destaque{border-left:3px solid var(--acento)}
.contatos{display:flex; flex-direction:column; gap:7px}
.contato{
  display:flex; align-items:center; gap:9px; padding:9px 11px; border-radius:9px;
  border:1px solid var(--linha); background:var(--surface-2); text-decoration:none; color:inherit;
}
.contato:hover{border-color:var(--acento); background:var(--acento-fraco)}
.contato .k{font-size:11.5px; color:var(--txt-3); width:64px; flex:0 0 auto}
.contato .v{font-size:13.5px; word-break:break-all}
.contato .fonte{margin-left:auto; font-size:10.5px; color:var(--txt-3); flex:0 0 auto}
.grade{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.dado{background:var(--surface-2); border:1px solid var(--linha); border-radius:9px; padding:8px 10px}
.dado .k{font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--txt-3)}
.dado .v{font-size:13.5px; margin-top:2px}
select.g, input.g, textarea.g{
  width:100%; padding:9px 10px; border:1px solid var(--linha); border-radius:9px;
  background:var(--surface-2); outline:none;
}
select.g:focus, input.g:focus, textarea.g:focus{border-color:var(--acento); box-shadow:0 0 0 3px var(--acento-fraco)}
textarea.g{resize:vertical; min-height:66px; font-size:13.5px}
.tags-edit{display:flex; flex-wrap:wrap; gap:6px}
.tag-btn{
  font-size:12px; padding:5px 9px; border-radius:7px; border:1px solid var(--linha);
  background:var(--surface-2); color:var(--txt-2);
}
.tag-btn.on{background:var(--acento); border-color:transparent; color:var(--acento-txt); font-weight:600}
.notas{display:flex; flex-direction:column; gap:8px; margin-top:9px}
.nota-item{border-left:2px solid var(--linha-forte); padding:2px 0 2px 10px}
.nota-item .quando{font-size:11px; color:var(--txt-3)}
.nota-item .txt{font-size:13.5px; white-space:pre-wrap}
.nota-item button{background:none;border:none;color:var(--txt-3);font-size:11px;padding:0;text-decoration:underline}
.fontes a{display:block; font-size:12.5px; color:var(--acento); word-break:break-all; margin-bottom:4px}
.linha-btn{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap}
.linha-campo{display:flex; gap:8px; align-items:stretch}
.linha-campo .btn{flex:0 0 auto}
.ok-inline{margin-left:8px; font-size:11px; font-weight:600; letter-spacing:0; text-transform:none; color:var(--txt-3)}
.ok-inline.on{color:var(--ok)}
.dica{margin-top:6px; font-size:11.5px; color:var(--txt-3)}
.prova{
  display:block; margin-top:8px; font-size:12.5px; color:var(--acento);
  text-decoration:none; border:1px dashed var(--linha-forte); border-radius:8px; padding:7px 9px;
}
.prova:hover{border-color:var(--acento); background:var(--acento-fraco)}
.prova b{display:block; font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--txt-3); margin-bottom:2px}

/* ---------- vazio geral ---------- */
.nada{
  margin:60px auto; max-width:440px; text-align:center; color:var(--txt-2);
}
.nada h2{font-size:18px; color:var(--txt); margin:0 0 8px}
.nada code{background:var(--surface); border:1px solid var(--linha); padding:2px 6px; border-radius:6px; font-size:13px}

@media (max-width:640px){
  header{padding:10px 12px}
  main{padding:10px 12px 14px}
  .coluna{flex:0 0 82vw; min-width:82vw}
  .acoes{margin-left:0; width:100%}
  .grade{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
  <div class="marca">
    <b>Painel de leads</b>
    <span id="sub-marca">carregando...</span>
  </div>

  <div class="busca">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="busca" type="search" placeholder="Buscar empresa, cidade, sinal..." autocomplete="off">
  </div>

  <div class="filtros">
    <select class="f" id="f-lote"><option value="">Todos os lotes</option></select>
    <select class="f" id="f-tier">
      <option value="">Todo calor</option>
      <option value="QUENTE">Quentes</option>
      <option value="MORNO">Mornos</option>
      <option value="FRIO">Frios</option>
    </select>
    <select class="f" id="f-tag"><option value="">Todas as marcas</option></select>
  </div>

  <div class="acoes">
    <span class="salvo" id="salvo"></span>
    <button class="btn" id="btn-csv" title="Baixar o que está filtrado, em planilha">Exportar</button>
    <button class="btn icone" id="btn-tema" title="Tema claro / escuro">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A8.5 8.5 0 1111.2 3a6.6 6.6 0 009.8 9.8z"/></svg>
    </button>
  </div>

  <div class="aviso off" id="aviso"></div>
</header>

<div class="resumo" id="resumo"></div>

<main>
  <div class="board" id="board"></div>
  <div class="nada" id="nada" style="display:none">
    <h2>Nenhum lead ainda</h2>
    <p>Rode a skill de prospecção no Claude Code e peça pra jogar os leads no painel.
    Eles aparecem aqui na coluna <b>Novos</b> assim que forem gerados.</p>
  </div>
</main>

<div class="fundo" id="fundo"></div>
<aside class="gaveta" id="gaveta" aria-hidden="true"></aside>

<!-- dados embutidos: só é usado quando o painel é aberto SEM o servidor (duplo clique no arquivo) -->
<script src="dados.js" onerror="window.__SEM_DADOS_JS__=true"></script>
<script>
(function(){
"use strict";

/* ============ colunas do funil ============ */
var COLUNAS = [
  {id:"novos",      nome:"Novos",      cor:"#2f5fe0"},
  {id:"contatado",  nome:"Contatado",  cor:"#7b5fd0"},
  {id:"respondeu",  nome:"Respondeu",  cor:"#0f8f7d"},
  {id:"proposta",   nome:"Proposta",   cor:"#b4740a"},
  {id:"fechado",    nome:"Fechado",    cor:"#1f7a45"},
  {id:"descartado", nome:"Descartado", cor:"#8a91a0"}
];
var TAGS = [
  {id:"quente",     nome:"Lead quente", classe:"t-quente"},
  {id:"morno",      nome:"Lead morno",  classe:"t-morno"},
  {id:"frio",       nome:"Lead frio",   classe:"t-frio"},
  {id:"respondeu",  nome:"Respondeu",   classe:"t-ok"},
  {id:"sem-resposta", nome:"Sem resposta", classe:""},
  {id:"follow-up",  nome:"Voltar depois", classe:""},
  {id:"nao-perturbe", nome:"Não perturbe", classe:""}
];

/* ============ estado em memória ============ */
var LEADS = [], ST = {leads:{}}, MODO = "arquivo", ABERTO = null, SALVANDO = null;

/* ============ helpers ============ */
function $(s){ return document.querySelector(s); }
function el(tag, cls, txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
function esc(s){ return String(s==null?"":s); }
function hoje(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function agora(){ var d=new Date(); return hoje()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function st(id){
  if(!ST.leads[id]) ST.leads[id] = {coluna:"novos", tags:[], notas:[], proxima_acao:"", visto:false};
  var s = ST.leads[id];
  if(!Array.isArray(s.tags)) s.tags=[];
  if(!Array.isArray(s.notas)) s.notas=[];
  if(!s.coluna) s.coluna="novos";
  return s;
}
function tierDe(l){
  if(l.tier) return String(l.tier).toUpperCase();
  var n = Number(l.nota_calor);
  if(!isFinite(n)) return "";
  return n>=70?"QUENTE":(n>=45?"MORNO":"FRIO");
}
function classeTier(t){ return t==="QUENTE"?"q":(t==="MORNO"?"m":""); }
function soDigitos(s){ return String(s||"").replace(/\D+/g,""); }

/* ============ carga ============ */
function carregar(){
  fetch("api/dados", {cache:"no-store"})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(d){ MODO="servidor"; aplicar(d); })
    .catch(function(){
      MODO="arquivo";
      var d = window.__CRM_DADOS__ || {leads:[], estado:{leads:{}}};
      var salvo = null;
      try { salvo = JSON.parse(localStorage.getItem("crm-leads-estado")||"null"); } catch(e){}
      if(salvo && salvo.leads) d.estado = salvo;
      aplicar(d);
      avisar("Aberto sem o servidor: o que você mexer fica guardado só neste navegador e pode se perder. Pra gravar no arquivo do projeto, feche e abra pelo atalho abrir-painel.");
    });
}
function aplicar(d){
  LEADS = (d.leads||[]).slice();
  ST = d.estado && d.estado.leads ? d.estado : {leads:{}};
  if(!ST.leads) ST.leads = {};
  LEADS.forEach(function(l){ if(!l.id) l.id = (l.empresa||"lead")+"|"+(l.cidade||""); });
  montarFiltros();
  render();
  // link direto pra um lead: painel.html#lead=<id>
  var alvo = decodeURIComponent(location.hash.replace(/^#lead=/, ""));
  if (alvo && alvo !== location.hash) {
    var achado = LEADS.filter(function(x){ return x.id===alvo || x.empresa===alvo; })[0];
    if (achado) abrir(achado.id);
  }
}
function avisar(txt){ var a=$("#aviso"); a.textContent=txt; a.classList.remove("off"); }

/* ============ persistência ============ */
// não guarda lead que você nunca tocou — o arquivo fica limpo e legível.
// Roda na hora de gravar (não antes), porque cada render recria as entradas em branco.
function paraGravar(){
  var saida = {versao:1, atualizado_em:agora(), leads:{}};
  Object.keys(ST.leads).forEach(function(k){
    var s = ST.leads[k];
    if(!s) return;
    var intocado = s.coluna==="novos" && !s.tags.length && !s.notas.length && !s.proxima_acao && !s.visto;
    if(!intocado) saida.leads[k] = s;
  });
  return saida;
}
function salvar(){
  ST.atualizado_em = agora();
  marcaSalvando();
  if(MODO==="servidor"){
    clearTimeout(SALVANDO);
    SALVANDO = setTimeout(function(){
      fetch("api/estado", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(paraGravar())})
        .then(function(r){ if(!r.ok) throw 0; marcaSalvo(); })
        .catch(function(){ avisar("Não consegui gravar o estado no arquivo. O servidor do painel foi fechado? Abra de novo pelo atalho abrir-painel."); });
    }, 350);
  } else {
    try{ localStorage.setItem("crm-leads-estado", JSON.stringify(paraGravar())); marcaSalvo(); }
    catch(e){ avisar("Este navegador não deixa guardar dados de arquivo aberto direto (é o caso do Firefox). Abra pelo atalho abrir-painel."); }
  }
}
var tSalvo;
function marcaSalvando(){ var s=$("#salvo"); s.textContent="salvando..."; s.classList.remove("on"); }
function marcaSalvo(){
  var s=$("#salvo"); s.textContent="salvo"; s.classList.add("on");
  clearTimeout(tSalvo); tSalvo=setTimeout(function(){ s.textContent=""; s.classList.remove("on"); }, 2200);
}

/* ============ filtros ============ */
function montarFiltros(){
  var lotes = {};
  LEADS.forEach(function(l){ if(l.lote) lotes[l.lote]=1; });
  var sel = $("#f-lote"); sel.length = 1;
  Object.keys(lotes).sort().forEach(function(k){ sel.appendChild(new Option(k, k)); });
  var st2 = $("#f-tag"); st2.length = 1;
  TAGS.forEach(function(t){ st2.appendChild(new Option(t.nome, t.id)); });
}
function filtrados(){
  var q = $("#busca").value.trim().toLowerCase();
  var lote = $("#f-lote").value, tier = $("#f-tier").value, tag = $("#f-tag").value;
  return LEADS.filter(function(l){
    if(lote && l.lote!==lote) return false;
    if(tier && tierDe(l)!==tier) return false;
    if(tag && st(l.id).tags.indexOf(tag)<0) return false;
    if(q){
      var alvo = [l.empresa,l.cidade,l.uf,l.segmento,l.sinal_oportunidade,l.gancho_abordagem,l.responsavel,l.lote].join(" ").toLowerCase();
      if(alvo.indexOf(q)<0) return false;
    }
    return true;
  });
}

/* ============ render ============ */
function render(){
  var itens = filtrados();
  $("#nada").style.display = LEADS.length ? "none" : "block";
  $("#board").style.display = LEADS.length ? "flex" : "none";
  $("#sub-marca").textContent = LEADS.length
    ? LEADS.length+" lead"+(LEADS.length>1?"s":"")+" · "+(MODO==="servidor"?"gravando no projeto":"modo local do navegador")
    : "nenhum lead ainda";

  // resumo
  var q=0,m=0,f=0, porCol={};
  itens.forEach(function(l){ var t=tierDe(l); if(t==="QUENTE")q++; else if(t==="MORNO")m++; else f++;
    var c=st(l.id).coluna; porCol[c]=(porCol[c]||0)+1; });
  var r = $("#resumo"); r.innerHTML="";
  function chip(html){ var c=el("div","chip"); c.innerHTML=html; r.appendChild(c); }
  chip('<span class="ponto q"></span>Quentes <b>'+q+'</b>');
  chip('<span class="ponto m"></span>Mornos <b>'+m+'</b>');
  chip('<span class="ponto"></span>Frios <b>'+f+'</b>');
  chip('Em aberto <b>'+((porCol.novos||0)+(porCol.contatado||0)+(porCol.respondeu||0)+(porCol.proposta||0))+'</b>');
  chip('Fechados <b>'+(porCol.fechado||0)+'</b>');
  if(itens.length!==LEADS.length) chip('Filtrando <b>'+itens.length+'</b> de '+LEADS.length);

  // colunas
  var board = $("#board"); board.innerHTML="";
  COLUNAS.forEach(function(col){
    var lista = itens.filter(function(l){ return st(l.id).coluna===col.id; })
      .sort(function(a,b){ return (Number(b.nota_calor)||0) - (Number(a.nota_calor)||0); });

    var c = el("div","coluna"); c.dataset.col = col.id;
    var topo = el("div","col-topo");
    var barra = el("div","barra"); barra.style.background = col.cor;
    topo.appendChild(barra);
    topo.appendChild(el("h2",null,col.nome));
    topo.appendChild(el("span","n",String(lista.length)));
    c.appendChild(topo);

    var ul = el("div","lista");
    if(!lista.length) ul.appendChild(el("div","vazio-col", col.id==="novos" ? "Sem leads novos" : "Arraste um card pra cá"));
    lista.forEach(function(l){ ul.appendChild(cardDe(l)); });
    c.appendChild(ul);

    c.addEventListener("dragover", function(e){ e.preventDefault(); c.classList.add("alvo"); });
    c.addEventListener("dragleave", function(){ c.classList.remove("alvo"); });
    c.addEventListener("drop", function(e){
      e.preventDefault(); c.classList.remove("alvo");
      var id = e.dataTransfer.getData("text/plain"); if(!id) return;
      mover(id, col.id);
    });
    board.appendChild(c);
  });
}

function cardDe(l){
  var s = st(l.id), t = tierDe(l);
  var c = el("div","card" + (s.tags.indexOf("nao-perturbe")>=0 ? " mudo":""));
  c.draggable = true; c.dataset.id = l.id;

  var l1 = el("div","l1");
  l1.appendChild(el("h3",null,l.empresa||"(sem nome)"));
  if(isFinite(Number(l.nota_calor))) {
    l1.appendChild(el("span","nota "+classeTier(t), String(Math.round(Number(l.nota_calor)))));
  }
  c.appendChild(l1);

  var loc = [l.cidade, l.uf].filter(Boolean).join("/");
  var sub = [l.segmento, loc].filter(Boolean).join(" · ");
  if(sub) c.appendChild(el("div","l2",sub));
  if(l.sinal_oportunidade) c.appendChild(el("div","sinal",l.sinal_oportunidade));

  var l3 = el("div","l3");
  if(!s.visto) l3.appendChild(el("span","selo-novo","NOVO"));
  s.tags.slice(0,2).forEach(function(id){
    var t2 = TAGS.filter(function(x){return x.id===id;})[0];
    if(t2) l3.appendChild(el("span","tag "+(t2.classe||""), t2.nome));
  });
  var mini = el("div","mini");
  if(l.whatsapp) mini.appendChild(icone("zap"));
  if(s.notas.length) mini.appendChild(icone("nota"));
  l3.appendChild(mini);
  c.appendChild(l3);

  c.addEventListener("dragstart", function(e){
    e.dataTransfer.setData("text/plain", l.id); e.dataTransfer.effectAllowed="move";
    c.classList.add("arrastando");
  });
  c.addEventListener("dragend", function(){ c.classList.remove("arrastando"); });
  c.addEventListener("click", function(){ abrir(l.id); });
  return c;
}
function icone(tipo){
  var s = document.createElementNS("http://www.w3.org/2000/svg","svg");
  s.setAttribute("width","13"); s.setAttribute("height","13"); s.setAttribute("viewBox","0 0 24 24");
  s.setAttribute("fill","none"); s.setAttribute("stroke","currentColor"); s.setAttribute("stroke-width","2");
  var p = document.createElementNS("http://www.w3.org/2000/svg","path");
  p.setAttribute("d", tipo==="zap"
    ? "M21 11.5a8.4 8.4 0 01-12.5 7.3L3 20.5l1.8-5.3A8.4 8.4 0 1121 11.5z"
    : "M4 5h16M4 10h16M4 15h10");
  s.appendChild(p); return s;
}

function mover(id, col){
  var s = st(id);
  if(s.coluna===col) return;
  s.coluna = col; s.visto = true; s.atualizado_em = hoje();
  if(col==="descartado" && s.tags.indexOf("nao-perturbe")<0){ /* descartar não é opt-out; marca é manual */ }
  salvar(); render();
  if(ABERTO===id) abrir(id);
}

/* ============ gaveta / dossiê ============ */
function abrir(id){
  var l = LEADS.filter(function(x){return x.id===id;})[0]; if(!l) return;
  var s = st(id);
  if(!s.visto){ s.visto = true; salvar(); }
  ABERTO = id;

  var g = $("#gaveta"); g.innerHTML=""; g.setAttribute("aria-hidden","false");

  var topo = el("div","g-topo");
  var l1 = el("div","linha1");
  l1.appendChild(el("h2",null,l.empresa||"(sem nome)"));
  var x = el("button","fechar","×"); x.title="Fechar (Esc)"; x.onclick=fechar; l1.appendChild(x);
  topo.appendChild(l1);
  var sub = [l.segmento, [l.cidade,l.uf].filter(Boolean).join("/"), l.lote].filter(Boolean).join(" · ");
  topo.appendChild(el("div","g-sub",sub));
  g.appendChild(topo);

  var b = el("div","g-corpo");

  // etapa + calor
  var bl = el("div","bloco");
  bl.appendChild(rot("Etapa no funil"));
  var sel = el("select","g");
  COLUNAS.forEach(function(c){ var o=new Option(c.nome,c.id); if(c.id===s.coluna) o.selected=true; sel.appendChild(o); });
  sel.onchange = function(){ mover(id, sel.value); };
  bl.appendChild(sel);
  b.appendChild(bl);

  var t = tierDe(l);
  if(l.nota_detalhe || isFinite(Number(l.nota_calor))){
    var bn = el("div","bloco");
    bn.appendChild(rot("Calor do lead"));
    var cx = el("div","caixa");
    cx.innerHTML = '<b>'+(isFinite(Number(l.nota_calor))?Math.round(Number(l.nota_calor))+"/100":"—")+
      (t?' · '+t:'')+'</b>' + (l.nota_detalhe? '<br><span style="color:var(--txt-3);font-size:12.5px">'+esc(l.nota_detalhe)+'</span>':'');
    bn.appendChild(cx); b.appendChild(bn);
  }

  // por que estou entrando em contato
  if(l.sinal_oportunidade){
    var b1 = el("div","bloco");
    b1.appendChild(rot("Por que entrar em contato agora"));
    b1.appendChild(caixa(l.sinal_oportunidade, true));
    // o link que PROVA o problema (não é o site bonito: é onde o defeito aparece)
    if(l.prova_url){
      var pv = el("a","prova"); pv.href = l.prova_url; pv.target="_blank"; pv.rel="noopener";
      pv.appendChild(el("b",null,"Confira você mesmo"));
      pv.appendChild(document.createTextNode(l.prova_nota || l.prova_url));
      b1.appendChild(pv);
    }
    b.appendChild(b1);
  }
  if(l.gancho_abordagem){
    var b2 = el("div","bloco");
    b2.appendChild(rot("Gancho de abordagem"));
    var cx2 = caixa(l.gancho_abordagem, false);
    b2.appendChild(cx2);
    var lb = el("div","linha-btn");
    var cp = el("button","btn","Copiar gancho");
    cp.onclick = function(){ copiar(l.gancho_abordagem); cp.textContent="Copiado"; setTimeout(function(){cp.textContent="Copiar gancho";},1400); };
    lb.appendChild(cp);
    if(l.whatsapp){
      var wa = el("button","btn principal","Abrir WhatsApp com o gancho");
      wa.onclick = function(){
        var num = soDigitos(l.whatsapp);
        window.open("https://wa.me/"+num+"?text="+encodeURIComponent(l.gancho_abordagem), "_blank");
      };
      lb.appendChild(wa);
    }
    b2.appendChild(lb);
    b.appendChild(b2);
  }

  // contatos
  var cont = [];
  if(l.whatsapp) cont.push(["WhatsApp", l.whatsapp, "https://wa.me/"+soDigitos(l.whatsapp), l.origem_dado]);
  if(l.telefone) cont.push(["Telefone", l.telefone, "tel:"+soDigitos(l.telefone), ""]);
  if(l.email)    cont.push(["E-mail", l.email, "mailto:"+l.email, l.email_confianca]);
  if(l.site)     cont.push(["Site", l.site, /^https?:/.test(l.site)?l.site:"https://"+l.site, ""]);
  if(l.instagram)cont.push(["Instagram", l.instagram, l.instagram.indexOf("http")===0?l.instagram:"https://instagram.com/"+String(l.instagram).replace("@",""), l.instagram_numeros||""]);
  if(l.facebook) cont.push(["Facebook", l.facebook, l.facebook.indexOf("http")===0?l.facebook:"https://facebook.com/"+l.facebook, ""]);
  if(l.google_negocio_url) cont.push(["Google", l.google_negocio||"perfil no Google", l.google_negocio_url, ""]);
  if(cont.length){
    var b3 = el("div","bloco");
    b3.appendChild(rot("Contatos"));
    var box = el("div","contatos");
    cont.forEach(function(c){
      var a = el("a","contato"); a.href=c[2]; a.target="_blank"; a.rel="noopener";
      a.appendChild(el("span","k",c[0]));
      a.appendChild(el("span","v",c[1]));
      if(c[3]) a.appendChild(el("span","fonte",c[3]));
      box.appendChild(a);
    });
    b3.appendChild(box); b.appendChild(b3);
  }

  // quem decide + dados
  var pares = [];
  if(l.responsavel) pares.push(["Quem decide", l.responsavel + (l.confianca_decisor? " ("+l.confianca_decisor+")":"")]);
  if(l.cargo_responsavel) pares.push(["Cargo", l.cargo_responsavel]);
  if(l.google_negocio) pares.push(["Google do negócio", l.google_negocio]);
  if(l.instagram_numeros) pares.push(["Instagram", l.instagram_numeros]);
  if(l.redes_atividade) pares.push(["Está postando?", l.redes_atividade]);
  if(l.reputacao) pares.push(["Reputação", l.reputacao]);
  if(l.anuncio) pares.push(["Anúncio", l.anuncio]);
  if(l.situacao_cadastral) pares.push(["Situação na Receita", l.situacao_cadastral]);
  if(l.porte) pares.push(["Porte", l.porte]);
  if(l.abertura) pares.push(["Empresa aberta em", l.abertura]);
  if(l.tecnologia) pares.push(["Como o site é feito", l.tecnologia]);
  if(l.data_coleta) pares.push(["Achado em", l.data_coleta]);
  if(l.origem_dado) pares.push(["Origem do dado", l.origem_dado]);
  if(pares.length){
    var b4 = el("div","bloco");
    b4.appendChild(rot("Ficha"));
    var gr = el("div","grade");
    pares.forEach(function(p){
      var d = el("div","dado");
      d.appendChild(el("div","k",p[0])); d.appendChild(el("div","v",p[1]));
      gr.appendChild(d);
    });
    b4.appendChild(gr); b.appendChild(b4);
  }
  if(l.pendencias){
    var b5 = el("div","bloco");
    b5.appendChild(rot("O que ficou faltando conferir"));
    b5.appendChild(caixa(l.pendencias,false));
    b.appendChild(b5);
  }

  // marcas
  var b6 = el("div","bloco");
  b6.appendChild(rot("Marcas"));
  var te = el("div","tags-edit");
  TAGS.forEach(function(tg){
    var on = s.tags.indexOf(tg.id)>=0;
    var bt = el("button","tag-btn"+(on?" on":""), tg.nome);
    bt.onclick = function(){
      var i = s.tags.indexOf(tg.id);
      if(i>=0) s.tags.splice(i,1); else s.tags.push(tg.id);
      s.atualizado_em = hoje();
      salvar(); render(); abrir(id);
    };
    te.appendChild(bt);
  });
  b6.appendChild(te); b.appendChild(b6);

  // próxima ação
  var b7 = el("div","bloco");
  var rotAcao = rot("Próxima ação");
  var okAcao = el("span","ok-inline","");
  rotAcao.appendChild(okAcao);
  b7.appendChild(rotAcao);
  var linhaAcao = el("div","linha-campo");
  var inp = el("input","g"); inp.type="text"; inp.value = s.proxima_acao||"";
  inp.placeholder = "ex.: mandar proposta na segunda";
  var btnAcao = el("button","btn","Salvar");
  function gravaAcao(){
    s.proxima_acao = inp.value.trim(); s.atualizado_em = hoje(); salvar();
    okAcao.textContent = "salvo"; okAcao.classList.add("on");
    clearTimeout(okAcao._t);
    okAcao._t = setTimeout(function(){ okAcao.textContent=""; okAcao.classList.remove("on"); }, 2000);
  }
  inp.oninput = function(){ okAcao.textContent = "digitando..."; okAcao.classList.remove("on"); gravaAcao(); };
  inp.onblur = gravaAcao;
  inp.onkeydown = function(e){ if(e.key==="Enter"){ e.preventDefault(); gravaAcao(); inp.blur(); } };
  btnAcao.onclick = gravaAcao;
  linhaAcao.appendChild(inp); linhaAcao.appendChild(btnAcao);
  b7.appendChild(linhaAcao);
  b7.appendChild(el("div","dica","Salva sozinho enquanto você digita. O botão é só pra confirmar."));
  b.appendChild(b7);

  // anotações
  var b8 = el("div","bloco");
  b8.appendChild(rot("Anotações"));
  var ta = el("textarea","g"); ta.placeholder="O que rolou na conversa...";
  b8.appendChild(ta);
  var lb2 = el("div","linha-btn");
  var add = el("button","btn principal","Anotar");
  add.onclick = function(){
    var v = ta.value.trim(); if(!v) return;
    s.notas.unshift({quando:agora(), texto:v}); s.atualizado_em=hoje();
    salvar(); render(); abrir(id);
  };
  lb2.appendChild(add); b8.appendChild(lb2);
  var ln = el("div","notas");
  s.notas.forEach(function(n,i){
    var it = el("div","nota-item");
    it.appendChild(el("div","quando",n.quando));
    it.appendChild(el("div","txt",n.texto));
    var del = el("button",null,"apagar");
    del.onclick = function(){ s.notas.splice(i,1); salvar(); render(); abrir(id); };
    it.appendChild(del);
    ln.appendChild(it);
  });
  b8.appendChild(ln); b.appendChild(b8);

  // fontes
  if(l.fontes && l.fontes.length){
    var b9 = el("div","bloco");
    b9.appendChild(rot("De onde veio a informação"));
    var fs = el("div","fontes");
    l.fontes.forEach(function(f){
      var url = typeof f==="string"? f : f.url;
      var nome = typeof f==="string"? f : (f.nota||f.url);
      var a = el("a",null,nome); a.href=url; a.target="_blank"; a.rel="noopener";
      fs.appendChild(a);
    });
    b9.appendChild(fs); b.appendChild(b9);
  }

  g.appendChild(b);
  g.classList.add("on"); $("#fundo").classList.add("on");
}
function rot(t){ return el("div","rot",t); }
function caixa(txt, destaque){ var c = el("div","caixa"+(destaque?" destaque":""), txt); return c; }
function fechar(){
  ABERTO=null;
  $("#gaveta").classList.remove("on"); $("#gaveta").setAttribute("aria-hidden","true");
  $("#fundo").classList.remove("on");
}
function copiar(t){
  if(navigator.clipboard) navigator.clipboard.writeText(t);
  else { var a=document.createElement("textarea"); a.value=t; document.body.appendChild(a); a.select(); document.execCommand("copy"); a.remove(); }
}

/* ============ exportar planilha ============ */
function exportar(){
  var cols = ["empresa","segmento","cidade","uf","whatsapp","telefone","email","site","instagram",
              "responsavel","sinal_oportunidade","gancho_abordagem","nota_calor","tier",
              "etapa","marcas","proxima_acao","ultima_anotacao","lote","data_coleta"];
  var linhas = [cols.join(";")];
  filtrados().forEach(function(l){
    var s = st(l.id);
    var col = COLUNAS.filter(function(c){return c.id===s.coluna;})[0];
    var v = {
      etapa: col?col.nome:s.coluna,
      marcas: s.tags.map(function(id){ var t=TAGS.filter(function(x){return x.id===id;})[0]; return t?t.nome:id; }).join(" | "),
      proxima_acao: s.proxima_acao||"",
      ultima_anotacao: s.notas.length? s.notas[0].texto : "",
      tier: tierDe(l)
    };
    linhas.push(cols.map(function(c){
      var val = (c in v) ? v[c] : (l[c]==null?"":l[c]);
      val = String(val).replace(/\r?\n/g," ").replace(/"/g,'""');
      return /[;"\n]/.test(val) ? '"'+val+'"' : val;
    }).join(";"));
  });
  var blob = new Blob(["﻿"+linhas.join("\r\n")], {type:"text/csv;charset=utf-8"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "leads-"+hoje()+".csv";
  document.body.appendChild(a); a.click(); a.remove();
}

/* ============ tema ============ */
function temaInicial(){
  var t = null;
  try { t = localStorage.getItem("crm-leads-tema"); } catch(e){}
  var atual = document.documentElement.dataset.tema;
  // tema fixado no próprio arquivo manda; senão vale a escolha salva; senão segue o sistema
  if(atual && atual!=="auto") return;
  document.documentElement.dataset.tema = t || "auto";
}
function trocarTema(){
  var atual = document.documentElement.dataset.tema;
  var escuroAgora = atual==="escuro" || (atual==="auto" && window.matchMedia("(prefers-color-scheme:dark)").matches);
  var novo = escuroAgora ? "claro" : "escuro";
  document.documentElement.dataset.tema = novo;
  try { localStorage.setItem("crm-leads-tema", novo); } catch(e){}
}

/* ============ liga ============ */
temaInicial();
$("#btn-tema").onclick = trocarTema;
$("#btn-csv").onclick = exportar;
$("#fundo").onclick = fechar;
["busca","f-lote","f-tier","f-tag"].forEach(function(id){
  var e = document.getElementById(id);
  e.addEventListener(id==="busca"?"input":"change", render);
});
document.addEventListener("keydown", function(e){
  if(e.key==="Escape") fechar();
  if(e.key==="/" && document.activeElement.tagName!=="INPUT" && document.activeElement.tagName!=="TEXTAREA"){
    e.preventDefault(); $("#busca").focus();
  }
});
carregar();
})();
