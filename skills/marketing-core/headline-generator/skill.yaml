## C. Headlines Específicos por Contexto

### Para Landing Page Hero
```
✅ "Ganhe R$5.000 em seu primeiro mês (mesmo começando do zero)"
✅ "Crie conteúdo viral em 15 minutos (a maioria gasta 4 horas)"
✅ "Triplicar seus seguidores sem aumentar suas horas de trabalho"
✅ "De nenhuma renda a R$15k/mês (em 6 meses)"
```

### Para Email Subject Line
```
✅ "Seu acesso grátis expira em 6h"
✅ "Como 500 pessoas ganharam R$10k (você pode ser próximo)"
✅ "[Seu nome], 50 pessoas já fizeram isso essa semana"
✅ "O que as agências não querem que você saiba (revelado hoje)"
✅ "Seu bônus de R$500 só vale hoje"
```

### Para Ad Headline (Facebook/Google)
```
✅ "Ganhe R$5k em 30 dias • Comece agora"
✅ "Triplicar vendas • Veja como"
✅ "Sem equipamento • Sem aparecer • Ganha bem"
✅ "100% comprovado • 5k pessoas • 9.2★ rating"
```

### Para Blog Post
```
✅ "Como 50k Creators Ganharam R$15k (Guia Completo 2026)"
✅ "5 Passos Para Triplicar Produtividade (Cientificamente Prováveis)"
✅ "Você Está Fazendo Errado: O Método Que Funciona"
```

### Para Social Media Post
```
✅ "Descobri por acaso..."
✅ "Ninguém comenta disso..."
✅ "A maioria faz ao contrário e falha"
✅ "Teste nos próximos 3 dias..."
```

### Para Product Launch
```
✅ "[Nome] — A plataforma que transformou R$2k em R$50k"
✅ "[Nome] — O método que os milionários usam"
✅ "[Nome] — Finalmente, viralizar de verdade"
```

