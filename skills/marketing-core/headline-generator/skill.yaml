## B. Fórmulas Práticas

### Fórmula 1: Benefit + Curiosity
```
[Promessa] + [Curiosidade] = Headline
"Como ganhar R$5k sem trabalhar 8h por dia (a maioria não sabe)"
"Triplicar suas vendas em 30 dias (segredo que Amazon usa)"
```

### Fórmula 2: How To + Number + Result
```
How to + [número] + [resultado específico]
"Como 50 pessoas ganharam R$15k em 30 dias com conteúdo"
"Como triplicar sua produtividade em 7 passos"
"Como vender R$100k online sem aparecer"
```

### Fórmula 3: Problem + Solution Teaser
```
[Problema que dói] + [Hint de solução]
"Cansado de postar e ninguém ver? Conheça o segredo de 10k creators"
"Sua landing page converte mal? Eis o que mudaria (em 5 minutos)"
"Ganhar pouco com sua expertise? Use o método dos 1% que ganha bem"
```

### Fórmula 4: Curiosity Gap
```
[Afirmação surpreendente] + [Promessa de explicação]
"Você está fazendo errado (e não sabe)"
"O que 99% dos criadores não faz (mas deveria)"
"Por que os ricos ganham enquanto você dorme (e você não)"
```

### Fórmula 5: Pattern Interrupt
```
[Quebra expectativa] + [Proposta diferente]
"Não precisa de 1M seguidores para ganhar R$15k/mês"
"Seu conteúdo ruim pode ser mais lucrativo que o bom"
"Esqueça viralizar. Faça ISSO em vez disso"
```

### Fórmula 6: Authority + Specific Result
```
[Credencial] + [Resultado mensurável]
"Professor 20 anos ensinou 5k alunos: 3 passos para triplicar sua renda"
"Estrategista que faturou R$1M revela: como começar do zero"
"Agência que cresceu de 0 a 50k/mês mostra: o sistema que funciona"
```

### Fórmula 7: Negative Reframe
```
[O que NÃO fazer] + [O que fazer]
"Pare de vender direto e comece a ganhar MUITO mais"
"Deixe de fazer conteúdo bonito e comece a viralizar"
"Nunca faça course assim (eis o jeito que funciona)"
```

