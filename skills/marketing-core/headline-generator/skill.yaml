## D. Fórmula HSO + Headline

Para estrutura completa de copy:

```
HEADLINE: "Triplicar sua renda em 30 dias (sem trabalhar mais)"

SUBHEADLINE: "5 mil criadores já aplicam esse sistema.
Descubra como R$0 virou R$15k em 30 dias."

HOOK: "Quando você entender isso, nunca mais vai ver conteúdo
do mesmo jeito."

STORY: "Há 1 ano eu ganhava R$2k/mês e trabalhava 12h por dia..."

OFFER: "Programa completo com 8 módulos. Normalmente R$897,
hoje R$197."
```

---

## E. Checklist de Headline

Antes de usar:

- [ ] Tem número? (específico, não vague)
- [ ] Promete benefício claro? (não feature, resultado)
- [ ] Cria urgência ou curiosidade? (why now? why this?)
- [ ] É diferente do que vejo no mercado? (unique angle)
- [ ] Faz meu cliente pensar "isso é pra mim"? (relevância)
- [ ] Cabe no espaço? (headlines não podem ser muito longas)
- [ ] Passaria no teste: se fosse ÚNICO no email/feed, eu clicaria? (curiosity check)

