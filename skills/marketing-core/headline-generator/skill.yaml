## F. Headlines Prontos para Copiar

Edite com seu nicho/resultado:

### Lançamento de Curso
- [ ] "De 0 a R$15k/mês em 6 meses (o método que 2k pessoas usam)"
- [ ] "Seu primeiro R$5k online: o passo a passo completo"
- [ ] "Como ganhar sem aparecer: descubra o sistema"

### Webinar/Live de Vendas
- [ ] "Como triplicar sua renda (sem trabalhar mais)"
- [ ] "O segredo que agências cobram R$5k (revelado hoje)"
- [ ] "De R$2k a R$50k: a fórmula que funciona"

### Email de Venda
