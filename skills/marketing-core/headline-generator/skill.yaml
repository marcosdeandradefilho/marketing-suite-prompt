# Headline Generator — Títulos que Vendem

Um bom headline é 50% da conversão. Aqui estão as fórmulas comprovadas.

## A. Framework 4U (Defensorir)

Um headline GANHA quando tem 4 qualidades:

### 1. **USEFUL** (Útil)
A pessoa ganha algo.
- ❌ "Conheça nossa plataforma"
- ✅ "Triplicar sua renda em 30 dias"
- ✅ "5 passos para dormir 2h menos e acordar renovado"

### 2. **URGENT** (Urgente)
Exige ação agora, não depois.
- ❌ "Como viralizar no Instagram"
- ✅ "Como viralizar no Instagram (antes das redes morrerem)"
- ✅ "O segredo que as agências cobram R$5k e não querem você saber"

### 3. **ULTRA-SPECIFIC** (Ultra-específico)
Números reais, não vague.
- ❌ "Ganhe dinheiro rápido"
- ✅ "Ganhe R$5.000 em seu primeiro mês"
- ✅ "De 0 a 50k seguidores em 6 meses"

### 4. **UNIQUE** (Único)
Diferente do resto do mercado.
- ❌ "Curso de email marketing"
- ✅ "O sistema de email que cria R$100k/ano SEM vender direto"
- ✅ "Como viralizar SEM nunca aparecer no rosto"

